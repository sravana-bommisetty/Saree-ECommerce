services:
  - type: web
    name: abhinayam-silks
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Abhinayam/Dockerfile
    dockerContext: ./Abhinayam
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: ""