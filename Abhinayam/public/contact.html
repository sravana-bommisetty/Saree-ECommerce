<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Abhinayam Silks</title>
  <meta name="description" content="Contact Abhinayam Silks on WhatsApp, Instagram, phone or email for saree enquiries, orders and video-call shopping.">
  <link rel="canonical" href="/contact">
  <meta name="theme-color" content="#6e1423">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="page-head"><h1>Contact Us</h1><p>We'd love to help you find your perfect saree</p></div>
  <main class="section container">
    <div class="contact-grid">
      <div class="contact-card">
        <div class="ico">💬</div><h3>WhatsApp</h3>
        <p data-setting="phone_display"></p>
        <a class="btn btn-wa" data-wa="Hello Abhinayam Silks! I have a question." href="#">Chat now</a>
      </div>
      <div class="contact-card">
        <div class="ico">📸</div><h3>Instagram</h3>
        <p>New arrivals &amp; styling</p>
        <a class="btn btn-gold" data-instagram href="#">Follow us</a>
      </div>
      <div class="contact-card">
        <div class="ico">✉️</div><h3>Email</h3>
        <p data-setting="email"></p>
        <a class="btn btn-outline" id="mail-link" href="#">Send email</a>
      </div>
      <div class="contact-card">
        <div class="ico">📍</div><h3>Visit us</h3>
        <p data-setting="address"></p>
        <p class="muted" data-setting="business_hours"></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/common.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
